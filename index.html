<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Macro Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');
        body { font-family: 'Space+Grotesk', sans-serif; background-color: #050a10; color: #e2e8f0; }
        .glow-border { border: 1px solid rgba(0, 242, 255, 0.2); }
        .critical-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto bg-[#0b1219] rounded-xl overflow-hidden border border-[#1e293b] shadow-2xl">
        <div class="p-6 border-b border-[#1e293b] flex flex-col md:flex-row justify-between items-center bg-[#0d151d] gap-4">
            <div>
                <h1 class="text-xl md:text-2xl font-bold tracking-widest text-white flex items-center gap-2">
                    <span class="text-cyan-400">🌐</span> GLOBAL MACRO COMMAND CENTER
                </h1>
                <p class="text-[10px] text-slate-500 mt-1 uppercase tracking-widest">McLean Godley | Geopolitical Strategy Unit</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <span class="block bg-red-900/20 text-red-500 text-[10px] px-2 py-1 rounded border border-red-500/30 critical-pulse font-bold mb-1">THREAT: CRITICAL</span>
                    <span id="clock" class="text-cyan-400 font-mono text-sm tracking-tighter">00:00:00</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3">
            <div class="lg:col-span-2 p-6 border-r border-[#1e293b]">
                <h2 class="text-xs font-bold text-slate-500 mb-8 flex items-center gap-2 uppercase tracking-widest">
                    <span class="w-2 h-2 bg-cyan-500 rounded-full animate-ping"></span> Real-Time Intelligence Sweep
                </h2>
                <div id="intel-container" class="space-y-8">
                    </div>
            </div>

            <div class="p-6 bg-[#080e14]">
                <h2 class="text-xs font-bold text-slate-500 mb-8 flex items-center gap-2 uppercase tracking-widest">📊 Active Asset Tracking</h2>
                <div id="asset-container" class="space-y-4">
                    </div>
            </div>
        </div>

        <div class="p-4 bg-[#0d151d] border-t border-[#1e293b] text-[9px] text-slate-600 flex justify-between uppercase tracking-[0.2em]">
            <span>System Status: Operational</span>
            <span class="text-cyan-900">Encrypted Data Bridge Active</span>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSHPSKPENsvV4nIteNVeKtUovjDtc_GDGctm_yoTPIK2NtniBn-iKX30Oy0gxBxPiLA3fDtCmSf-SV/pub?gid=0&single=true&output=csv';

        async function updateDashboard() {
            try {
                const response = await fetch(CSV_URL);
                const text = await response.text();
                // Improved CSV parsing to handle commas inside news text
                const rows = text.split('\n').map(row => {
                    const matches = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    return matches ? matches.map(m => m.replace(/^"|"$/g, '')) : row.split(',');
                });

                const assetContainer = document.getElementById('asset-container');
                const intelContainer = document.getElementById('intel-container');
                
                assetContainer.innerHTML = '';
                intelContainer.innerHTML = '';

                rows.forEach(row => {
                    // Update Assets (Columns A and B)
                    if (row[0] && row[1] && !isNaN(parseFloat(row[1]))) {
                        assetContainer.innerHTML += `
                            <div class="p-4 rounded-lg bg-[#0b1219] border border-white/5 hover:border-cyan-500/30 transition-all">
                                <div class="flex justify-between items-start mb-1">
                                    <span class="text-white font-bold tracking-wider">${row[0]}</span>
                                    <span class="text-cyan-400 font-mono text-sm font-bold">$${parseFloat(row[1]).toFixed(2)}</span>
                                </div>
                                <div class="text-[8px] text-slate-600 uppercase tracking-tighter">Market Price | Live Feed</div>
                            </div>
                        `;
                    }

                    // Update Intelligence (Column C)
                    if (row[2] && row[2].trim().length > 5) {
                        intelContainer.innerHTML += `
                            <div class="relative pl-6 border-l border-cyan-500/20 py-1">
                                <div class="absolute -left-[3px] top-2 w-[6px] h-[6px] bg-cyan-500 rounded-full shadow-[0_0_8px_rgba(6,182,212,0.5)]"></div>
                                <p class="text-sm text-slate-300 leading-relaxed font-light">${row[2]}</p>
                            </div>
                        `;
                    }
                });
            } catch (e) { console.error("Sync Error", e); }
        }

        function clock() {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('en-GB');
        }

        setInterval(updateDashboard, 300000); // Sync every 5 mins
        setInterval(clock, 1000);
        updateDashboard();
        clock();
    </script>
</body>
</html>
