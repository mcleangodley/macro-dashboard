<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Macro Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');
        body { font-family: 'Space+Grotesk', sans-serif; background-color: #050a10; color: #e2e8f0; }
        .glow-border { border: 1px solid rgba(0, 242, 255, 0.2); box-shadow: 0 0 15px rgba(0, 242, 255, 0.05); }
        .critical-pulse { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto bg-[#0b1219] rounded-xl overflow-hidden border border-[#1e293b]">
        <div class="p-6 border-b border-[#1e293b] flex justify-between items-center bg-[#0d151d]">
            <div>
                <h1 class="text-2xl font-bold tracking-widest text-white flex items-center gap-2">
                    <span class="text-cyan-400">🌐</span> GLOBAL MACRO COMMAND CENTER
                </h1>
                <p class="text-xs text-slate-500 mt-1 uppercase tracking-tighter">Strategic Portfolio & Geopolitical Integration</p>
            </div>
            <div class="text-right">
                <div class="flex items-center gap-3 justify-end">
                    <span class="bg-red-900/30 text-red-500 text-[10px] px-2 py-1 rounded border border-red-500/50 critical-pulse font-bold">THREAT: CRITICAL</span>
                    <span id="clock" class="text-cyan-400 font-mono text-sm">00:00:00</span>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-0">
            <div class="lg:col-span-2 p-6 border-r border-[#1e293b]">
                <h2 class="text-sm font-bold text-slate-400 mb-6 flex items-center gap-2 uppercase">⚠️ Real-Time Intelligence Sweep</h2>
                <div id="intel-container" class="space-y-6">
                    <p class="text-slate-500 italic text-sm">Establishing data bridge...</p>
                </div>
            </div>

            <div class="p-6 bg-[#080e14]">
                <h2 class="text-sm font-bold text-slate-400 mb-6 flex items-center gap-2 uppercase">📉 Active Asset Tracking</h2>
                <div id="asset-container" class="space-y-4">
                    </div>
            </div>
        </div>

        <div class="p-4 bg-[#0d151d] border-t border-[#1e293b] text-[10px] text-slate-500 flex justify-between uppercase tracking-widest">
            <span>McKinsey/Fund Strategic Assessment Active</span>
            <span class="text-cyan-500/50 italic">Live Sync Enabled via Google Sheets API</span>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSSHPSKPENsvV4nIteNVeKtUovjDtc_GDGctm_yoTPIK2NtniBn-iKX30Oy0gxBxPiLA3fDtCmSf-SV/pub?gid=0&single=true&output=csv';

        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split('\n').map(row => row.split(','));
                
                updateAssets(rows);
                updateIntel(rows);
            } catch (error) {
                console.error('Data sync failed:', error);
            }
        }

        function updateAssets(rows) {
            const container = document.getElementById('asset-container');
            container.innerHTML = '';
            
            // Assuming first 5 rows are assets
            rows.slice(0, 5).forEach(row => {
                if(!row[0]) return;
                const card = `
                    <div class="p-3 rounded bg-[#0b1219] border border-white/5 flex justify-between items-center">
                        <div>
                            <div class="text-white font-bold text-sm">${row[0]}</div>
                            <div class="text-[9px] text-slate-500 uppercase">Live Market Feed</div>
                        </div>
                        <div class="text-right">
                            <div class="text-cyan-400 font-mono font-bold">$${parseFloat(row[1]).toFixed(2)}</div>
                            <div class="text-[8px] text-emerald-500">Live Data ●</div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        function updateIntel(rows) {
            const container = document.getElementById('intel-container');
            container.innerHTML = '';
            
            rows.slice(0, 5).forEach(row => {
                if(!row[2]) return;
                const intel = `
                    <div class="border-l-2 border-cyan-500/30 pl-4 py-1">
                        <div class="text-[10px] font-bold text-cyan-500/70 mb-1">DATA PACKET RECEIVED</div>
                        <p class="text-sm text-slate-300 leading-relaxed">${row[2]}</p>
                    </div>
                `;
                container.innerHTML += intel;
            });
        }

        // Clock Function
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: false });
        }

        // Initialize and Set Intervals
        setInterval(fetchData, 300000); // 5 mins
        setInterval(updateClock, 1000);
        fetchData();
        updateClock();
    </script>
</body>
</html>
